<!DOCTYPE html>
<!--
    Portada de entrada.

    Unico trabajo: mandar al visitante a la pagina real del catalogo,
    que es un .jsp. Se hace con meta refresh para que la barra de
    direcciones quede mostrando la ruta .jsp.
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=controladores/index.jsp">
    <title>Inmobiliaria</title>
</head>
<body>
    <p>Si no eres redirigido automaticamente,
       <a href="controladores/index.jsp">entra aqui</a>.</p>
</body>
</html>
